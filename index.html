    <!--
      Set the theme class before first paint (no flash of the wrong theme). Falls back to
      dark, matching the design's dark-first treatment (AuroraTextEffect, glow accents).
      The theme-toggle component itself only ever flips the `dark` class on <html>, so this
      must stay in sync with that, not with a `data-theme` attribute (nothing reads that).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var isDark = stored ? stored === "dark" : true;
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
